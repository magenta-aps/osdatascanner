{% if account.image %}
  <img class="userprofile-image" src="{{ account.image }}">
{% elif account.initials %}
  <span style="background-color: {{ account.initials_color }}"
        class="account_initials">
    <span>{{ account.initials }}</span>
  </span>
{% else %}
  <i class="material-symbols">account_circle</i>
{% endif %}
