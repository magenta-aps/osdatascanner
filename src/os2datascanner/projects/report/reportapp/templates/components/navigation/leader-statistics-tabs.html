{% load i18n %}

<div class="scrollbar-content">
  <div class="tabs">
    {% if show_units_tab %}
      <a class="tabs__control {% if active_tab == "units" %}active{% endif %}"
         href="{% url "statistics-leader-units" %}">{% trans "Organizational units" %}</a>
    {% endif %}
    {% if show_accounts_tab %}
      <a class="tabs__control {% if active_tab == "accounts" %}active{% endif %}"
         href="{% url "statistics-leader-accounts" %}">{% trans "Employees" %}</a>
    {% endif %}
    <a class="tabs__control {% if active_tab == "results" %}active{% endif %}"
       href="{% url "statistics-leader-results" %}">{% trans "Statistics" %}</a>
  </div>
</div>
