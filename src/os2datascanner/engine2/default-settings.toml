# Should the system be a bit chattier and more tolerant of developer fiddling?
DEBUG = false

# A unique secret for this OS2datascanner engine installation, used in key
# derivation for cryptographic primitives
secret_value = ""

# [logging]
LOG_LEVEL = "INFO"

# Should engine2 attempt to translate its strings?
USE_I18N = true
# A list, in order of preference, of language identifiers to be given to the
# translation infrastructure. Specify an empty list to use the default
# gettext autodetection logic, although be warned that this may not make sense
# outside of interactive use
LANGUAGES = ["da"]

# Should engine2 attempt to forcibly enable the legacy OpenSSL provider?
# (required for some on-premises Exchange scans)
FORCE_LEGACY_OPENSSL_PROVIDER = true

# Should we preprocess PDF files before scanning them?
# Uses pymupdf's ez_save with clean=True (corresponds to mutools clean -sc)
[pdf]
PREPROCESS_PDF = true

[amqp]
# Nested amqp settings are picked up by the common amqp utility module
AMQP_HOST = "localhost"
AMQP_USER = ""
AMQP_PWD = ""
AMQP_SCHEME = "amqp"
AMQP_PORT = 5672
AMQP_HEARTBEAT = 6000
AMQP_VHOST = "/"
    [amqp.AMQP_BACKOFF_PARAMS]
    max_tries = 10
    ceiling = 7
    warn_after = 6
    fuzz = 0

[subprocess]
# The maximum runtime allowed for an external tool (in seconds)
timeout = 45
# Timeout specifically for PymuPDF pre-processing (in seconds)
pdf_clean_timeout = 900

[tesseract]
# Extra arguments to be added to the Tesseract command line, if any
# Disabling inverted search (white text on black) to improve speed
# as it's unlikely to be relevant anyway.
extra_args = ["-l", "dan+eng", "-c", "tessedit_do_invert=0"]

[pipeline]
# The maximum runtime (in seconds) allowed:
# * in the processor stage, for a single conversion operation; or
# * in the tagger stage, for a single metadata extraction
op_timeout = 60
# The number of times to try one of the above pipeline operations
op_tries = 2
# Extra modules to be imported as the pipeline starts up (useful for trying out
# _staging data sources, for example)
extra_modules = []

[pipeline.processor]
# The chance (from 0 to 100) that any given conversion will fail with a fake
# transient error (requires DEBUG)
fail_percentage = 0

[pipeline.matcher]
# The maximum number of match objects to return for each rule that matches
# (must be at least 1)
obj_limit = 10

[pipeline.worker]
# Should the worker hash files to check for duplicates?
CHECK_DUPLICATION = false
# Per-object liveness heartbeat. A worker only reports
# progress on a top-level object once it has spent this many seconds on it,
# and then at most once per interval. (Between object processings)
# Objects faster than threshold never emit anything.
OBJECT_PROGRESS_THRESHOLD_SECONDS = 60
OBJECT_PROGRESS_INTERVAL_SECONDS = 15

[pipeline.worker.dedup]
# Should workers coordinate through a shared store so that content appearing in
# several places is converted once instead of once per copy? Every location is
# still reported: a worker that skips the conversion replays the first one's
# matches against its own object. Requires a reachable store (see host below);
# when there isn't one, every check fails open and the worker converts exactly
# as it would with this disabled.
#
# Unrelated to [pipeline.worker] CHECK_DUPLICATION, which decides whether a
# worker reports a content identifier for the admin module's duplication
# statistics.
enabled = false

# Connection details for the shared claim and result store (a Valkey or Redis
# server; the two are wire-compatible and this feature uses only commands common
# to both).
# An empty host disables coordination however `enabled` is set.
host = ""
port = 6379
db = 0
# Credentials, for a store that requires them. The stored results describe real
# findings in real documents, so a store reachable from anywhere else on the
# network should want these; leave them empty and no authentication is
# attempted. Set them through the environment
# (pipeline__worker__dedup__password) rather than in a settings file wherever
# that is an option.
username = ""
password = ""
# Seconds to wait on the store before giving up. Kept short deliberately: a
# worker that cannot reach the store this quickly should get on with converting
# rather than hold up the pipeline.
socket_timeout = 2

# Objects smaller than this are never coordinated (in bytes).
#
# The threshold is where coordinating an object stops paying for itself.
# Measured on plain text with no match in it, which is the least coordination
# can save, the two meet somewhere between 4 and 8 kB, and coordinating is a
# clear win from about 16 kB up.
#
# Objects of a type in always_types skip this check, and nothing is coordinated
# unless converting it would produce something (see can_convert).
min_size = 16384

# How long, in seconds, to allow for identifying an object's content before
# giving up and converting it without coordinating.
identify_timeout = 300

# MIME types worth coordinating whatever their size, for formats whose
# conversion cost is driven by their content rather than their byte count. A
# trailing wildcard ("image/*") matches a whole family.
#
# Images are here because of what they cost rather than what they weigh: a 20 kB
# signature logo is seconds of OCR, and the same handful of them turns up in
# every mail in a department. Objects a scan is configured not to convert at all
# (skip_mime_types, which is image/* when OCR is off) are never coordinated,
# whatever this says.
always_types = ["application/pdf", "image/*"]

# How long, in milliseconds, a claim on an in-flight conversion stays valid
# without being renewed. Renewal is hung off the conversion's abort check, so
# this has to outlast the longest stretch of a conversion that reaches no such
# check: the pre-processing of a PDF, bounded by [subprocess] pdf_clean_timeout.
# A shorter lease expires while its holder is still working, and the content is
# then converted twice.
lease_ms = 1800000

# How long, in seconds, a stored result stays available for other copies to
# replay. Reading a result renews it, so this is how long a result may go
# *unused* before it is discarded, not how long it lives in total.
#
# A backstop rather than the usual way results go: the admin module tells the
# pipeline when a scan is over, and a worker then drops everything held for it.
# This covers a scan nobody ever declared finished, because it stalled or
# because no worker was running to hear about it.
result_ttl = 604800

# How long, in milliseconds, to leave a copy in the deferral queue, indexed by
# the number of times it has already been deferred. The final value repeats.
backoff_ms = [60000, 120000, 300000, 600000]

# Once a copy has spent this long deferred in total, it stops waiting for the
# claim holder and converts the content itself, which bounds the damage when a
# claim disappears without its result having been written. In milliseconds, and
# should comfortably exceed the longest conversion worth deduplicating: a copy
# that gives up early pays for the conversion in full anyway.
max_deferral_ms = 14400000

[conversions.cache]
# The directory in which to store cached representations of objects, if
# applicable
directory = ""

[model]
# The maximum nesting depth; after this point, Source.from_handle will return
# None
# (ten should be generous enough for any realistic situation -- for example, an
# image (1) on page 4 (2) of a PDF file (3) in a Zip file (4) attached (5) to
# an email (6) exported to an .eml file (7) and then forwarded as an attachment
# (8) in another email (9) would still pose no problems)
max_depth = 10

[model.libreoffice]
# The size at which LibreOffice-generated HTML should be thrown away and
# replaced by a new plaintext conversion (in bytes)
size_threshold = 1048576

# Note that these settings only affect WebSource/WebResource
[model.http]
# The maximum number of outgoing HTTP requests an individual process can make
# every second
limit = 2
# timeout for requests (in seconds)
timeout = 45
# Maximum allowed depth of related links while crawling a domain
ttl = 25

[model.msgraph]
# The maximum number of items to retrieve in each API call to the server
page_size = 100

# The time to spend waiting for an API response to begin (in seconds)
timeout = 30

[model.sbsysdb]
# The URL to a document-proxy service for retrieving file listings, content and
# metadata from a SBSYS database
document_proxy = ""
# If we find a SBSYS file flagged as an alternate, should we ignore it?
ignore_alternates = true
# Force runtime reflection to be used over the prebaked sbsysdb_tables module?
force_reflection = false

[utils.oauth2]
# The number of seconds to wait for a client credentials response from an OAuth
# 2.0 token provider before concluding that something has gone wrong
cc_token_timeout = 180
